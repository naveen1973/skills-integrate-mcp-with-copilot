<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div class="activity-toolbar" aria-label="Activity discovery controls">
          <div class="form-group search-group">
            <label for="activity-search">Search activities</label>
            <input type="search" id="activity-search" placeholder="Search by name or description" />
          </div>
          <div class="form-group">
            <label for="category-filter">Category</label>
            <select id="category-filter">
              <option value="all">All categories</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sort-activities">Sort by</label>
            <select id="sort-activities">
              <option value="name">Name</option>
              <option value="category">Category</option>
              <option value="date">Upcoming date</option>
            </select>
          </div>
          <div class="view-toggle" role="group" aria-label="Activity view">
            <button type="button" class="view-button active" data-view="list">List</button>
            <button type="button" class="view-button" data-view="calendar">Calendar</button>
          </div>
        </div>
        <p id="results-summary" class="results-summary" aria-live="polite"></p>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
